<!DOCTYPE html>
<html lang="pt-br">
<head>
    
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 90vh;
            justify-content: center;
        }
        .icone{
            height: 20px;
            width: 20px;
        }
        .preto-e-branco{
            filter: grayscale(100%);
        }
        .image{
            width: 400px;
        }
        .alto-contraste{
            background-color: black;
            color: white;
            filter: contrast(500%);
        }
        
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <div>
        <button id="preto-e-branco" ><img class="icone" src="img/preto_e_branco.png" alt="" srcset=""></button>
        <button id="aumentar-texto"><img class="icone" src="img/a_mais.png" alt=""></button>
        <button id="diminuir-texto"><img class="icone" src="img/a_menos.png" alt=""></button>
        <button id="alternar-contraste"><img class="icone" src="img/alto_contraste.png" alt=""></button>
        <button><img class="icone" src="img/libras.png" alt=""></button>
        <button><img class="icone" src="img/voz.png" alt=""></button>
    </div>
    <h1>Teste de ferramentas ACD</h1>
    <a href="#">clique aqui</a>
    <img class="image" src="img/ACD.jpg" alt="">

    <div vw class="enabled">
        <div vw-access-button class="active"></div>
        <div vw-plugin-wrapper>
          <div class="vw-plugin-top-wrapper"></div>
        </div>
      </div>
      <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
      <script>
        new window.VLibras.Widget();
      </script>

</body>
<script type="text/javascript">
    window.onload = function(){
        var corpoDaPagina = document.querySelector('body');
        var aumentarTexto = document.getElementById('aumentar-texto');
        var diminuirTexto = document.getElementById('diminuir-texto');
        
        var fontSize = 100;

        var qntAumentarDiminuir = 10;

        aumentarTexto.addEventListener(
            'click',function(event){
                fontSize = fontSize + qntAumentarDiminuir;
                corpoDaPagina.style.fontSize = fontSize + '%';
            }
        );

        diminuirTexto.addEventListener(
            'click', function(event){
                fontSize = fontSize - qntAumentarDiminuir;
                corpoDaPagina.style.fontSize = fontSize + '%';
            }
        );
    
    }

    

    document.getElementById('preto-e-branco').addEventListener('click',function(event){
        document.body.classList.toggle('preto-e-branco');
    });
    document.getElementById('alternar-contraste').addEventListener(
        'click',function(){
            document.body.classList.toggle('alto-contraste');
        }
    );
</script>

</html>
